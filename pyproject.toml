[project]
name = "meqng"
version = "0.1.0"
description = "Minimal-edit negative generator for evidence-grounded QA (DPO data construction)"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "datasets>=2.19.0",
  "transformers>=4.41.0",
  "accelerate>=0.31.0",
  "torch>=2.2.0",
  "spacy>=3.7.0",
  "sentence-transformers>=3.0.0",
  "rapidfuzz>=3.9.0",
  "pydantic>=2.7.0",
  "orjson>=3.10.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
grammar = ["language-tool-python>=2.8.0"]

[project.scripts]
meqng = "meqng.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
