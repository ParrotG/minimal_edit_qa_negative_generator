[project]
name = "grounded-qa-sft"
version = "0.1.0"
description = "Grounded QA SFT data, training, and evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "datasets>=2.19.0",
  "transformers>=4.41.0",
  "accelerate>=0.31.0",
  "torch>=2.2.0",
  "spacy>=3.7.0",
  "sentence-transformers>=3.0.0",
  "rapidfuzz>=3.9.0",
  "pydantic>=2.7.0",
  "orjson>=3.10.0",
  "tqdm>=4.66.0",
  "httpx>=0.27.0",
  "qa-metrics>=0.2.42",
]

[project.optional-dependencies]
grammar = ["language-tool-python>=2.8.0"]
attack = ["textattack>=0.3.10"]
lora = ["peft>=0.11.0"]
eval = ["deepeval>=2.0.0"]

[project.scripts]
qa-verifier = "qa_judge.verifier:app"
grounded-qa = "grounded_qa.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
